<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2EDD8"><title>Broker workspace | Dream Space</title><link rel="stylesheet" href="styles.css"><style>
.broker-main{max-width:1280px;margin:auto;padding:clamp(25px,5vw,60px) clamp(16px,5vw,65px)}.broker-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.broker-head h1{font:clamp(34px,4vw,48px) Georgia;color:var(--teal);margin:12px 0}.broker-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.broker-tabs button{padding:11px 16px;border:1px solid var(--line);background:#fff;color:var(--teal);border-radius:3px}.broker-tabs button.active{background:var(--teal);color:white}.broker-tools{display:flex;gap:12px;margin:18px 0}.broker-tools input,.broker-tools select,.broker-form input,.broker-form select,.broker-form textarea{padding:12px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;min-width:0}.broker-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.broker-card{background:#fff;border:1px solid var(--line);min-width:0}.broker-card img{width:100%;height:210px;object-fit:cover}.broker-card .property-info{padding:16px}.broker-card .tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--teal2)}.broker-panel{background:#fff;border:1px solid var(--line);padding:clamp(16px,3vw,25px);margin:15px 0}.broker-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.broker-form label{display:grid;gap:7px;font-size:12px}.broker-form .wide{grid-column:1/-1}.broker-form textarea{min-height:100px}.broker-form button{grid-column:1/-1;justify-self:start}.broker-empty{padding:25px;border:1px dashed var(--line);color:var(--muted)}.submission-row{padding:15px;border:1px solid var(--line);margin:10px 0;background:#fff}.submission-row h3{font:22px Georgia;color:var(--teal);margin:7px 0}.status-tag{display:inline-block;background:var(--cream);padding:5px 8px;font-size:10px;color:var(--teal)}.status-comment{padding:10px;background:var(--cream);font-size:12px;margin-top:10px}.profile-form{max-width:560px}
@media(max-width:760px){.broker-main{padding:25px 15px}.broker-head{align-items:flex-start;flex-direction:column}.broker-tools{flex-direction:column}.broker-grid{grid-template-columns:1fr}.broker-form{grid-template-columns:1fr}.broker-form .wide{grid-column:auto}.broker-form button{width:100%}.broker-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.broker-tabs button{width:100%}}
</style></head><body><header class="header"><a class="brand" href="index.html"><img src="assets/dream-space-logo.svg" alt="Dream Space" style="width:155px;height:auto"></a><button class="outline" id="logout">Sign out</button></header><main class="broker-main"><div class="broker-head"><div><p class="eyebrow">BROKER WORKSPACE</p><h1>Welcome to your workspace</h1><p id="brokerName" class="muted">Loading your account…</p></div></div><div class="broker-tabs"><button class="active" data-tab="inventory">Property inventory</button><button data-tab="submissions">My submissions</button><button data-tab="submit">Submit a property</button><button data-tab="profile">My profile</button></div>
<section id="inventoryTab"><div class="broker-tools"><input id="search" placeholder="Search property or location"><select id="category"><option value="">All accessible inventory</option><option value="broker">All-broker listings</option><option value="exclusive">Assigned exclusively to me</option><option value="public">Public listings</option></select></div><div id="inventory" class="broker-grid"><p class="broker-empty">Loading your inventory…</p></div></section>
<section id="submissionsTab" class="hidden"><div id="mySubmissions"></div></section>
<section id="submitTab" class="hidden"><div class="broker-panel"><h2>Submit a property for review</h2><p class="muted">Your listing remains private until an admin reviews and approves it.</p><form id="submissionForm" class="broker-form"><label>Property title<input name="title" required></label><label>Location<input name="location" required placeholder="Area, city"></label><label>Google Maps link<input name="google_maps_url" type="url" placeholder="https://maps.google.com/..."></label><label>Property type<select name="property_type"><option>Villa</option><option>Apartment</option><option>Plot</option><option>Land</option><option>Commercial</option><option>Other</option></select></label><label>Listing type<select name="listing_type"><option value="sale">For sale</option><option value="rent">For rent</option><option value="commercial_lease">Commercial lease</option></select></label><label>Price / rent amount<input name="price" type="number" min="0"></label><label>Bedrooms<input name="bedrooms" type="number" min="0"></label><label>Bathrooms<input name="bathrooms" type="number" min="0"></label><label>Built-up area<input name="built_up_area" type="number" min="0"></label><label>Area unit<select name="area_unit"><option value="sqft">Sq. ft.</option><option value="sqm">Sq. m.</option><option value="acre">Acres</option></select></label><label class="wide">Description<textarea name="description"></textarea></label><label class="wide">Photos and videos<input name="media" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple></label><p class="muted wide">Maximum 50 MB per file. Uploads are stored privately while awaiting approval.</p><p class="notice wide" id="submissionMessage"></p><button class="solid">Submit for admin review</button></form></div></section>
<section id="profileTab" class="hidden"><div class="broker-panel"><h2>My profile</h2><form id="profileForm" class="broker-form profile-form"><label>Full name<input name="full_name" required></label><label>Phone<input name="phone"></label><label class="wide">Email<input name="email" disabled></label><p class="notice wide" id="profileMessage"></p><button class="solid">Save profile</button></form></div><div class="broker-panel"><h2>Change password</h2><form id="passwordForm" class="broker-form profile-form"><label class="wide">New password<input name="password" type="password" minlength="8" required></label><label class="wide">Confirm new password<input name="confirm" type="password" minlength="8" required></label><p class="notice wide" id="passwordMessage"></p><button class="solid">Update password</button></form></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="broker.js"></script><script src="notifications.js"></script></body></html>
