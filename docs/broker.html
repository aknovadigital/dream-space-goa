<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broker workspace | Dream Space Goa</title><link rel="stylesheet" href="styles.css"><style>.broker-main{max-width:1200px;margin:auto;padding:55px 6vw}.broker-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.broker-head h1{font:42px Georgia}.broker-tools{display:flex;gap:12px;margin:25px 0}.broker-tools input,.broker-tools select{padding:12px;border:1px solid var(--line);background:white}.broker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.broker-card{background:#fff;border:1px solid var(--line)}.broker-card img{width:100%;height:220px;object-fit:cover}.broker-card .property-info{padding:18px}.broker-card .tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--olive)}.broker-empty{padding:30px;border:1px dashed var(--line);color:var(--muted)}@media(max-width:760px){.broker-grid{grid-template-columns:1fr}.broker-head{align-items:flex-start;flex-direction:column}.broker-tools{flex-direction:column}}</style></head><body><header class="header"><a class="brand" href="index.html"><span>DREAM SPACE</span><small>GOA · BROKER WORKSPACE</small></a><button class="outline" id="logout">Sign out</button></header><main class="broker-main"><div class="broker-head"><div><p class="eyebrow">PRIVATE BROKER INVENTORY</p><h1>Welcome to your workspace</h1><p id="brokerName" class="muted">Your assigned property inventory</p></div></div><div class="broker-tools"><input id="search" placeholder="Search property or location"><select id="category"><option value="">All accessible inventory</option><option value="broker">All-broker listings</option><option value="exclusive">Assigned exclusively to me</option><option value="public">Public listings</option></select></div><div id="inventory" class="broker-grid"><p class="broker-empty">Loading your inventory…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="broker.js"></script></body></html>
