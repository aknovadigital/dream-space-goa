<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream Space | Password recovery</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:var(--cream);padding:20px}.box{width:min(100%,460px);background:#fff;padding:30px;border:1px solid var(--line)}.box h1{font:34px Georgia;color:var(--teal)}.box label{display:block;margin:13px 0 6px;font-size:13px}.box input{width:100%;padding:12px;border:1px solid var(--line)}.box button{margin-top:18px}.msg{font-size:13px;color:var(--teal);min-height:22px}</style></head><body><main class="box"><img src="assets/dream-space-logo.svg" alt="Dream Space" style="width:150px"><h1>Reset your password</h1><p>Verify the recovery OTP sent to your email and create a new password.</p><form id="resetForm"><label>Email address</label><input name="email" type="email" required><label>Recovery OTP</label><input name="token" inputmode="numeric" autocomplete="one-time-code" required><label>New password</label><input name="password" type="password" minlength="10" required><label>Confirm password</label><input name="confirm" type="password" minlength="10" required><button class="solid">Verify and reset password</button></form><p id="message" class="msg" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="broker-reset.js"></script></body></html>
