<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2EDD8"><title>Property details | Dream Space</title><link rel="stylesheet" href="styles.css?v=20261125-transparent-hero-header"><style>
.property-page{max-width:1380px;margin:0 auto;padding:46px clamp(18px,5vw,76px) 70px}
.property-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
.property-top .back-link{font-size:13px;color:var(--teal);border-bottom:1px solid var(--line);padding-bottom:6px}
.property-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.85fr);gap:clamp(28px,4vw,58px);align-items:start}
.property-gallery{min-width:0;margin:0}
.property-gallery-main{width:100%;height:min(54vw,650px);min-height:390px;background:#e9e3d3;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 40px #123b4a14}
.property-gallery-main img,.property-gallery-main video{width:100%;height:100%;object-fit:cover;display:block}
.property-gallery-thumbs{display:flex;gap:9px;overflow-x:auto;padding:13px 2px 8px;scrollbar-width:thin}
.property-gallery-thumb{position:relative;flex:0 0 94px;width:94px;height:70px;padding:0;border:2px solid transparent;border-radius:3px;background:#eee9dc;cursor:pointer;overflow:hidden}
.property-gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.property-gallery-thumb.active{border-color:var(--teal)}
.property-gallery-thumb span{position:absolute;right:5px;bottom:5px;background:var(--teal);color:#fff;padding:2px 5px;font-size:9px}
.property-gallery-count{font-size:11px;color:var(--muted);margin:0}
.property-info-panel{background:#fff;border:1px solid var(--line);border-radius:5px;padding:clamp(22px,3vw,38px);box-shadow:0 16px 40px #123b4a0c}
.property-info-panel .eyebrow{margin:0 0 12px}
.property-info-panel h1{font:500 clamp(34px,4vw,52px)/1.12 var(--serif);color:var(--teal);margin:0 0 15px}
.property-location{font-size:14px;color:var(--muted);margin:0 0 22px}
.property-price{font:500 clamp(25px,3vw,34px) var(--serif);color:var(--teal);margin:0 0 22px}
.property-price small{display:block;font:10px var(--sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.property-divider{height:1px;background:var(--line);margin:22px 0}
.property-specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.property-spec{padding:13px;background:var(--paper);border:1px solid #eee9dc;border-radius:3px}
.property-spec small{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}
.property-spec strong{font-size:13px;color:var(--teal)}
.property-description{white-space:pre-wrap;color:var(--muted);font-size:13px;line-height:1.85;margin:0}
.property-features{padding-left:18px;color:var(--muted);font-size:13px;line-height:1.9}
.property-enquiry-section{margin-top:54px;padding:clamp(24px,4vw,44px);background:#f2edd8;border:1px solid var(--line);border-radius:5px;display:grid;grid-template-columns:.8fr 1.2fr;gap:35px;align-items:start}
.property-enquiry-copy h2{font:500 clamp(30px,4vw,42px)/1.15 var(--serif);color:var(--teal);margin:10px 0 12px}
.property-enquiry-copy p{font-size:13px;line-height:1.8;color:var(--muted);max-width:360px}
.property-enquiry-form{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.property-enquiry-form input,.property-enquiry-form textarea{background:#fff;border:1px solid var(--line);border-radius:3px;padding:13px 14px;min-height:46px}
.property-enquiry-form textarea{grid-column:1/-1;min-height:95px;resize:vertical}
.property-enquiry-form button{justify-self:start;min-width:190px}
.property-enquiry-form .detail-message{grid-column:1/-1;font-size:12px;color:var(--teal2);margin:0}
.property-contact-options{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--teal)}
.property-contact-options a{text-decoration:underline;text-underline-offset:4px}
@media(max-width:900px){.property-layout{grid-template-columns:1fr}.property-gallery-main{height:60vw;min-height:320px;max-height:560px}.property-info-panel{padding:26px}.property-enquiry-section{grid-template-columns:1fr;gap:15px}}
@media(max-width:600px){.property-page{padding:24px 14px 48px}.property-top{margin-bottom:18px}.property-gallery-main{height:68vw;min-height:245px}.property-gallery-thumb{flex-basis:78px;width:78px;height:60px}.property-info-panel{padding:21px}.property-info-panel h1{font-size:36px}.property-enquiry-section{margin-top:32px;padding:20px 16px}.property-enquiry-form{grid-template-columns:1fr}.property-enquiry-form textarea,.property-enquiry-form .detail-message{grid-column:auto}.property-enquiry-form button{width:100%}}
</style></head><body><header class="header"><a class="brand" href="index.html"><img src="assets/dream-space-logo.svg" alt="Dream Space — Land, Villas, Commercial Leasing"></a><a href="index.html#homes">← All properties</a></header><main id="propertyDetail" class="property-page"><p class="empty">Loading property…</p></main><footer><a class="footer-brand" href="index.html"><img src="assets/dream-space-logo.svg" alt="Dream Space"></a><span>© Dream Space</span></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="property.js?v=20261125-side-by-side-detail"></script></body></html>
