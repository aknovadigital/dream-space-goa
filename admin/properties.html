<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Properties | Dream Space Admin</title><link rel="stylesheet" href="admin.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">DREAM SPACE<small>ADMIN CRM</small></div><nav><a class="navlink" href="dashboard.html">Overview</a><a class="navlink active" href="properties.html">Properties</a><a class="navlink" href="inquiries.html">Enquiries</a></nav><div class="sidebar-bottom"><div id="adminEmail" style="font-size:10px;color:#cbd5d1;padding:12px"></div><button class="navlink" id="logout">Sign out</button></div></aside><main class="main"><div class="topbar"><div><div class="muted">PROPERTY INVENTORY</div><h1>Properties</h1></div><button class="btn gold" id="newProperty">+ Add property</button></div><section class="panel hidden" id="editor"><div class="panel-head"><h2 id="formTitle">Add property</h2><button class="smallbtn" id="closeEditor" type="button">Close</button></div><form id="propertyForm"><input type="hidden" id="propertyId"><div class="form-grid"><div class="field"><label>Property title *</label><input id="title" required></div><div class="field"><label>Location *</label><input id="location" required placeholder="e.g. Siolim, North Goa"></div><div class="field"><label>Listing type</label><select id="listingType"><option value="sale">For sale</option><option value="rent">For rent</option><option value="commercial">Commercial</option></select></div><div class="field"><label>Property type</label><select id="propertyType"><option>Apartment</option><option>Villa</option><option>Plot</option><option>Commercial space</option><option>Other</option></select></div><div class="field"><label>Price (numeric, optional)</label><input id="price" type="number" min="0" step="1"></div><div class="field"><label>Price label (e.g. ₹80 lakh / On enquiry)</label><input id="priceLabel" placeholder="Price on enquiry"></div><div class="field"><label>Bedrooms</label><input id="bedrooms" type="number" min="0"></div><div class="field"><label>Bathrooms</label><input id="bathrooms" type="number" min="0"></div><div class="field"><label>Area / size</label><input id="area" placeholder="e.g. 1,500 sq. ft."></div><div class="field"><label>Status</label><select id="status"><option value="draft">Draft (not public)</option><option value="published">Published</option><option value="sold">Sold</option><option value="rented">Rented</option><option value="archived">Archived</option></select></div><div class="field wide"><label>Description</label><textarea id="description" rows="4"></textarea></div><div class="field wide"><label>Features (comma separated)</label><input id="features" placeholder="Private pool, furnished, parking"></div><div class="field wide"><label>Property photos (select multiple)</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="photo-preview" id="photoPreview"></div><small class="muted">Images upload to the Supabase property-images bucket. Maximum 10 MB each.</small></div></div><div class="actions"><button class="btn" type="submit" id="saveProperty">Save property</button><button class="btn light" type="button" id="cancelEdit">Cancel</button></div><p class="error" id="formError"></p></form></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Search title or location"><select id="statusFilter"><option value="">All statuses</option><option>published</option><option>draft</option><option>sold</option><option>rented</option><option>archived</option></select></div><div class="table-wrap"><table><thead><tr><th>Property</th><th>Listing</th><th>Price</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="propertyRows"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="admin.js"></script><script src="properties-admin.js"></script></body></html>
